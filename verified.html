<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetTrace — Email Verified</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #FFF7ED 0%, #FFFFFF 50%, #F5F3FF 100%);
      color: #1F2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #FFFFFF;
      max-width: 440px;
      width: 100%;
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px -15px rgba(255, 102, 0, 0.12),
                  0 0 1px 1px rgba(0, 0, 0, 0.04);
      text-align: center;
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .icon-container {
      width: 88px;
      height: 88px;
      background: #ECFDF5;
      border: 3px solid #A7F3D0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      color: #10B981;
    }
    .icon-container svg {
      width: 44px;
      height: 44px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF7ED;
      color: #FF6600;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 102, 0, 0.2);
    }
    h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #111827;
      margin-bottom: 12px;
      line-height: 1.25;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #4B5563;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #FF6600;
      color: #FFFFFF;
      text-decoration: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 15px;
      font-weight: 700;
      padding: 16px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 20px -5px rgba(255, 102, 0, 0.35);
      transition: transform 0.15s ease, background-color 0.15s ease;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background: #E65C00;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(1px);
    }
    .footer-note {
      margin-top: 24px;
      font-size: 13px;
      color: #9CA3AF;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge" id="cardBadge">
      🐾 PetTrace Community
    </div>
    
    <div class="icon-container" id="cardIcon">
      <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>

    <h1 id="cardTitle">Email Verified!</h1>
    <p id="cardDesc">Your email has been successfully verified. Your PetTrace account is now active and ready to keep your pets safe.</p>

    <a href="pettrace://verified" class="btn" id="openAppBtn">
      <span id="btnText">Open PetTrace App</span>
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
      </svg>
    </a>

    <p class="footer-note" id="footerNote">You can also close this window and sign in directly inside the app.</p>
  </div>

  <script>
    (function() {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      
      // Parse parameters from either query (?type=recovery) or hash (#access_token=...&type=recovery)
      var fullParamsStr = (search ? search.substring(1) + '&' : '') + (hash.startsWith('#') ? hash.substring(1) : hash);
      var params = new URLSearchParams(fullParamsStr);
      
      var type = params.get('type');
      var isRecovery = (type === 'recovery') || fullParamsStr.indexOf('type=recovery') !== -1;
      var errorCode = params.get('error') || params.get('error_code');
      var errorDesc = params.get('error_description');

      var cardBadge = document.getElementById('cardBadge');
      var cardIcon = document.getElementById('cardIcon');
      var cardTitle = document.getElementById('cardTitle');
      var cardDesc = document.getElementById('cardDesc');
      var openAppBtn = document.getElementById('openAppBtn');
      var btnText = document.getElementById('btnText');
      var footerNote = document.getElementById('footerNote');

      // Crucial: preserve query parameters and hash so Supabase in Flutter receives the tokens!
      var targetDeepLink = 'pettrace://verified' + search + hash;

      if (errorCode) {
        cardBadge.textContent = '⚠️ Security Notice';
        cardBadge.style.color = '#EF4444';
        cardBadge.style.borderColor = 'rgba(239, 68, 68, 0.3)';
        cardIcon.innerHTML = '<svg fill="none" stroke="#EF4444" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>';
        cardIcon.style.background = '#FEF2F2';
        cardIcon.style.borderColor = '#FECACA';
        cardTitle.textContent = 'Link Expired';
        cardDesc.textContent = errorDesc ? decodeURIComponent(errorDesc.replace(/\+/g, ' ')) : 'This link has expired or has already been used. Please request a new one from the app.';
        btnText.textContent = 'Return to PetTrace';
        if (footerNote) footerNote.textContent = 'Please open the PetTrace app and try again.';
      } else if (isRecovery) {
        cardBadge.textContent = '🔐 Password Recovery';
        cardBadge.style.color = '#FF6600';
        cardIcon.innerHTML = '<svg fill="none" stroke="#FF6600" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>';
        cardIcon.style.background = '#FFF7ED';
        cardIcon.style.borderColor = '#FED7AA';
        cardTitle.textContent = 'Reset Password';
        cardDesc.textContent = 'Your reset link is verified! Redirecting to PetTrace so you can enter your new password...';
        btnText.textContent = 'Enter New Password';
        if (footerNote) footerNote.textContent = 'Tap the button above if PetTrace does not open automatically.';
      }

      openAppBtn.href = targetDeepLink;

      // Automatically attempt to trigger deep link into the mobile app if on Android/iOS
      var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile) {
        setTimeout(function() {
          window.location.href = targetDeepLink;
        }, 600);
      }
    })();
  </script>
</body>
</html>
